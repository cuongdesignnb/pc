services:
  # ===================
  # NGINX WEBSERVER
  # ===================
  nginx:
    image: nginx:alpine
    container_name: pc_nginx
    restart: unless-stopped
    ports:
      - "8901:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - frontend
    networks:
      - pc_network

  # ===================
  # PHP-FPM (Laravel)
  # ===================
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: pc_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - mysql
      - redis
    networks:
      - pc_network

  # ===================
  # NUXT 3 FRONTEND
  # ===================
  frontend:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: pc_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8902:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    command: sh -c "npm install && npm run dev"
    networks:
      - pc_network

  # ===================
  # MYSQL DATABASE
  # ===================
  mysql:
    image: mysql:8.0
    container_name: pc_mysql
    restart: unless-stopped
    ports:
      - "33061:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: pc_shop
      MYSQL_USER: pc_user
      MYSQL_PASSWORD: pc_secret
    volumes:
      - pc_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - pc_network

  # ===================
  # REDIS CACHE
  # ===================
  redis:
    image: redis:7-alpine
    container_name: pc_redis
    restart: unless-stopped
    ports:
      - "63791:6379"
    volumes:
      - pc_redis_data:/data
    networks:
      - pc_network

  # ===================
  # MEILISEARCH
  # ===================
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: pc_meilisearch
    restart: unless-stopped
    ports:
      - "7701:7700"
    environment:
      MEILI_MASTER_KEY: pc_meili_master_key_2026
      MEILI_NO_ANALYTICS: true
    volumes:
      - pc_meilisearch_data:/meili_data
    networks:
      - pc_network

  # ===================
  # MAILPIT (Dev Email)
  # ===================
  mailpit:
    image: axllent/mailpit
    container_name: pc_mailpit
    restart: unless-stopped
    ports:
      - "8026:8025"
      - "10251:1025"
    networks:
      - pc_network

  # ===================
  # QUEUE WORKER
  # ===================
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: pc_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    depends_on:
      - php
      - redis
    networks:
      - pc_network

networks:
  pc_network:
    driver: bridge

volumes:
  pc_mysql_data:
  pc_redis_data:
  pc_meilisearch_data:
