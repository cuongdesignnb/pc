name: KIOT integration gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiot-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: Consumer backend and frontends
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pc_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:qUGGmND6tGLuPD2LSLQbo4V8K8q/bFdhALKRVUVD8No=
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_DATABASE: pc_test
      DB_HOST: 127.0.0.1
      DB_PASSWORD: root
      DB_PORT: 3306
      DB_USERNAME: root
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      KIOT_INTEGRATION_ENABLED: "false"
      KIOT_PRODUCT_SYNC_ENABLED: "false"
      KIOT_ORDER_SYNC_ENABLED: "false"

    steps:
      - name: Check out tested head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare and migrate database
        working-directory: backend
        run: |
          php artisan optimize:clear
          php artisan migrate:fresh --env=testing --force

      - name: Verify KIOT consumer contract
        working-directory: backend
        run: php artisan test --filter=Kiot

      - name: Verify full backend suite
        working-directory: backend
        run: php artisan test

      - name: Verify migration rollback and re-apply
        working-directory: backend
        run: |
          php artisan migrate:rollback --env=testing --force --step=3
          php artisan migrate --env=testing --force

      - name: Verify changed PHP style and syntax
        shell: bash
        run: |
          git fetch --no-tags origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'backend/**/*.php')
          test "${#files[@]}" -gt 0
          relative=()
          for file in "${files[@]}"; do relative+=("${file#backend/}"); done
          cd backend
          php vendor/bin/pint --test "${relative[@]}"
          for file in "${relative[@]}"; do php -l "$file"; done

      - name: Build Admin
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Build Nuxt storefront
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Scan tracked source
        shell: bash
        run: |
          added="$(git diff --unified=0 origin/main...HEAD -- backend/app backend/config backend/database backend/routes backend/scripts backend/tests backend/resources/js frontend/app docs/integrations | sed -n '/^+/p' | sed '/^+++/d')"
          if grep -P '(?<![A-Za-z0-9_-])(dd|dump|var_dump|ray)\s*\(' <<<"$added"; then
            echo "Debug helper found in tracked source"
            exit 1
          fi
          if grep -E 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' <<<"$added"; then
            echo "Credential-like value found in tracked files"
            exit 1
          fi
          if grep -E 'Ãƒ|Ã„|Ã†|Ã¡|Ä|áº|á»|â‚¬|â€œ|â€|ðŸ|�' <<<"$added"; then
            echo "Possible mojibake found"
            exit 1
          fi
          git diff --check origin/main...HEAD
